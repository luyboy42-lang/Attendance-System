<!DOCTYPE html>
<html lang="km" class="h-full bg-slate-950 text-slate-100">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gate Dynamic QR Kiosk Display</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { brand: { 500: '#6366f1', 600: '#4f46e5' } },
          fontFamily: { sans: ['Inter', 'Battambang', 'sans-serif'] }
        }
      }
    }
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Battambang:wght@400;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="js/api-config.js"></script>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="h-full flex flex-col justify-center items-center p-4">
  <div class="glass-panel rounded-3xl p-8 shadow-2xl max-w-md w-full border border-slate-800 text-center relative overflow-hidden">
    <div class="mb-6">
      <span class="px-3 py-1 rounded-full bg-indigo-500/20 text-indigo-300 border border-indigo-500/30 text-xs font-semibold uppercase tracking-wider">Gate Door Security Display</span>
      <h2 class="text-2xl font-bold text-white mt-2">ស្កែន QR Code ដើម្បីកត់ត្រាវត្តមាន</h2>
      <!-- កែសម្រួលអត្ថបទបង្ហាញរយៈពេល -->
<p class="text-xs text-slate-400 mt-1">
  QR Code នេះនឹងផ្លាស់ប្ដូរដោយស្វ័យប្រវត្តិគំលាត ១ ថ្ងៃម្តង
</p>
    </div>

    <div class="relative w-64 h-64 mx-auto bg-white p-4 rounded-2xl shadow-2xl flex items-center justify-center">
      <div id="kioskQrCanvas" class="w-full h-full flex items-center justify-center"></div>
    </div>

    <div class="max-w-xs mx-auto mt-6">
      <div class="flex justify-between items-center text-xs text-slate-400 mb-1.5">
  <span>Dynamic Token Refresh (1 Day Validity)</span>
  <span id="timerCountdown" class="font-mono text-brand-400">24h 00m</span>
</div>
<!-- Progress Bar -->
<div class="w-full bg-slate-900 h-2 rounded-full overflow-hidden border border-slate-800">
  <div id="refreshProgress" class="bg-gradient-to-r from-brand-600 to-indigo-400 h-full w-full transition-all duration-1000"></div>
</div>
    
    <div class="mt-6 pt-4 border-t border-slate-800 flex justify-between text-xs text-slate-400">
      <a href="index.html" class="hover:text-white">← User App</a>
      <a href="admin.html" class="hover:text-white">Admin Portal →</a>
    </div>
  </div>

  <script src="js/dynamic-qr.js"></script>
</body>
</html>
